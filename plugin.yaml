name: approval-notifier
version: 1.0.0
description: "Windows approval alerts with plain-language explanations: when a dangerous-command approval prompt appears, pop an instant Toast with the risk translated to Chinese (60 built-in rules mapped), alarm-beep every 15s until resolved, then follow up with a Toast explaining what the command actually does — generated by your active model, no extra API key."
author: "WHW"
homepage: "https://github.com/play1216/hermes-approval-notifier"
license: "MIT"
hooks:
  - pre_approval_request
  - post_approval_response
