name: approval-notifier
version: 1.1.0
description: "Never miss or misread a dangerous-command approval prompt in Hermes Agent: Windows Toast alerts (with your own looping alert sound, e.g. an F1 radio chime), and plain-Chinese command explanations generated by your active model. No extra API key."
